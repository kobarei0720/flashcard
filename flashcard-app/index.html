<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS SAP-C02 フラッシュカード</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="header">
            <h1>🎯 AWS SAP-C02 フラッシュカード</h1>
            <div class="stats">
                <span class="stat-item">
                    <span class="stat-label">進捗:</span>
                    <span id="progress-count">0</span>/<span id="total-count">0</span>
                </span>
                <span class="stat-item">
                    <span class="stat-label">正解率:</span>
                    <span id="accuracy">0</span>%
                </span>
                <span class="stat-item marked">
                    <span class="stat-label">マーク:</span>
                    <span id="marked-count">0</span>
                </span>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- 問題カード -->
            <div class="question-card" id="question-card">
                <div class="question-header">
                    <span class="question-number" id="question-number">問題 1</span>
                    <button class="mark-btn" id="mark-btn" title="マークする">
                        <span class="mark-icon">⭐</span>
                    </button>
                </div>
                
                <div class="question-text" id="question-text">
                    問題文がここに表示されます...
                </div>
                
                <div class="choices" id="choices">
                    <!-- 選択肢がここに動的に生成される -->
                </div>
                
                <div class="answer-section hidden" id="answer-section">
                    <div class="answer-result" id="answer-result"></div>
                    <div class="correct-answer" id="correct-answer"></div>
                    <button class="show-original-btn" id="show-original-btn">原文を表示</button>
                    <div class="original-text hidden" id="original-text"></div>
                </div>
            </div>

            <!-- コントロールボタン -->
            <div class="controls">
                <button class="control-btn secondary" id="prev-btn" disabled>
                    ← 前の問題
                </button>
                <button class="control-btn primary" id="submit-btn">
                    回答する
                </button>
                <button class="control-btn primary hidden" id="next-btn">
                    次の問題 →
                </button>
            </div>
        </main>

        <!-- 設定パネル -->
        <aside class="settings-panel" id="settings-panel">
            <button class="settings-toggle" id="settings-toggle">⚙️ 設定</button>
            <div class="settings-content hidden" id="settings-content">
                <h3>出題設定</h3>
                <label class="setting-item">
                    <input type="checkbox" id="prioritize-marked" checked>
                    マークした問題を優先
                </label>
                <label class="setting-item">
                    <input type="checkbox" id="shuffle-choices" checked>
                    選択肢をシャッフル
                </label>
                <label class="setting-item">
                    <span>マーク問題の出現率:</span>
                    <select id="marked-frequency">
                        <option value="2">2倍</option>
                        <option value="3" selected>3倍</option>
                        <option value="5">5倍</option>
                    </select>
                </label>
                <hr>
                <h3>データ管理</h3>
                <button class="control-btn danger" id="reset-progress">
                    進捗をリセット
                </button>
                <button class="control-btn secondary" id="export-data">
                    データをエクスポート
                </button>
            </div>
        </aside>

        <!-- フィルターパネル -->
        <div class="filter-panel">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="marked">マーク済み</button>
            <button class="filter-btn" data-filter="incorrect">間違えた問題</button>
            <button class="filter-btn" data-filter="unseen">未回答</button>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
